name: Bug report
description: Report a reproducible Leafy AI defect.
title: "[LEAFY-000] Bug: "
labels: ["bug"]
body:
  - type: input
    id: jira
    attributes:
      label: Jira issue
      placeholder: LEAFY-000
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and evidence
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
